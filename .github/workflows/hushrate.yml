name: hushrate

on:
  schedule:
    - cron: "17 * * * *"     # every hour at :17 UTC (off the busy top of the hour)
  workflow_dispatch:
  push:
    branches: [main]

# One run at a time: the agent spends test USDC and commits data, so runs must never overlap.
concurrency:
  group: hushrate
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  record:
    # Only scheduled and manual runs buy data. A normal push just rebuilds and redeploys.
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Record the hourly market tape
        env:
          EVM_PRIVATE_KEY: ${{ secrets.EVM_PRIVATE_KEY }}
          TELEGRAPH_NODE: https://devnode.telegraphprotocol.com
        run: npm run agent
      # Never rebase or merge generated data: save it, reset to the remote, copy it back (the run's files win),
      # commit and push, retrying up to 3 times. The script runs from a copy because the reset rewrites the tree.
      - name: Commit new data
        if: always()
        run: |
          git config user.name "ace-coderr"
          git config user.email "207328107+ace-coderr@users.noreply.github.com"
          cp scripts/commit-data.sh "$RUNNER_TEMP/commit-data.sh"
          bash "$RUNNER_TEMP/commit-data.sh"

  deploy:
    needs: record
    # Run after a successful record, after a failed one (to publish the status file), and on plain pushes.
    if: always() && (needs.record.result == 'success' || needs.record.result == 'failure' || needs.record.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Build web
        env:
          VITE_BASE: /hushrate/
        run: npm run build -w web
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist
      - id: deployment
        uses: actions/deploy-pages@v4
