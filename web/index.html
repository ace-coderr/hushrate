<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Hushrate: hourly run-or-curtail decisions for bitcoin mining sites, with receipts you can check. Testnet only." />
    <meta name="theme-color" content="#141414" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='2' y='9' width='8' height='14' rx='3' fill='%23FFB020'/%3E%3Crect x='12' y='5' width='8' height='22' rx='3' fill='%234CC9F0'/%3E%3Crect x='22' y='12' width='8' height='8' rx='3' fill='%238d8d8d'/%3E%3C/svg%3E" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet" />
    <title>Hushrate</title>
    <script>
      // Apply the saved theme before first paint to avoid a flash.
      try {
        var s = JSON.parse(localStorage.getItem("hushrate.settings.v1") || "{}");
        var t = s.theme || "dark";
        var dark = t === "system" ? window.matchMedia("(prefers-color-scheme: dark)").matches : t === "dark";
        document.documentElement.setAttribute("data-theme", dark ? "dark" : "light");
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
